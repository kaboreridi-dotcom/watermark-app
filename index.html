<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filigraner - Photos & Vidéos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>WatermarkLab</span>
      </div>
      <p class="tagline">Ajoutez un filigrane texte ou image à vos fichiers en toute simplicité.</p>
    </header>

    <main class="main-content">
      <!-- Panneau des Contrôles -->
      <aside class="sidebar">
        <!-- Section 1 : Fichier Source -->
        <section class="control-group">
          <h2>1. Fichier principal</h2>
          <label class="file-upload-btn">
            <input type="file" id="mediaInput" accept="image/*,video/*">
            <span id="mediaFileName">Choisir une image ou vidéo</span>
          </label>
        </section>

        <!-- Section 2 : Type de Filigrane -->
        <section class="control-group">
          <h2>2. Type de filigrane</h2>
          <div class="segmented-control">
            <button class="tab-btn active" data-type="text">Texte</button>
            <button class="tab-btn" data-type="image">Image</button>
          </div>

          <!-- Configuration Texte -->
          <div id="textControls" class="tab-content active">
            <div class="input-field">
              <label for="watermarkText">Texte du filigrane</label>
              <input type="text" id="watermarkText" value="© Mon Filigrane">
            </div>
            <div class="input-grid">
              <div class="input-field">
                <label for="textColor">Couleur</label>
                <input type="color" id="textColor" value="#ffffff">
              </div>
              <div class="input-field">
                <label for="textSize">Taille (px)</label>
                <input type="number" id="textSize" value="36" min="10" max="200">
              </div>
            </div>
          </div>

          <!-- Configuration Image -->
          <div id="imageControls" class="tab-content">
            <div class="input-field">
              <label class="file-upload-btn secondary">
                <input type="file" id="watermarkImageInput" accept="image/*">
                <span id="watermarkImageName">Charger le logo</span>
              </label>
            </div>
            <div class="input-field">
              <label for="imageScale">Taille (%)</label>
              <input type="range" id="imageScale" min="5" max="100" value="20">
            </div>
          </div>
        </section>

        <!-- Section 3 : Position & Style -->
        <section class="control-group">
          <h2>3. Position & Opacité</h2>
          <div class="input-field">
            <label>Position</label>
            <div class="position-grid">
              <button class="pos-btn" data-pos="top-left">↖</button>
              <button class="pos-btn" data-pos="top-center">↑</button>
              <button class="pos-btn" data-pos="top-right">↗</button>
              <button class="pos-btn" data-pos="center-left">←</button>
              <button class="pos-btn active" data-pos="center">┼</button>
              <button class="pos-btn" data-pos="center-right">→</button>
              <button class="pos-btn" data-pos="bottom-left">↙</button>
              <button class="pos-btn" data-pos="bottom-center">↓</button>
              <button class="pos-btn" data-pos="bottom-right">↘</button>
            </div>
          </div>
          <div class="input-field">
            <label for="opacity">Opacité (<span id="opacityVal">80</span>%)</label>
            <input type="range" id="opacity" min="10" max="100" value="80">
          </div>
          <div class="input-field">
            <label for="margin">Marge des bords (px)</label>
            <input type="range" id="margin" min="0" max="100" value="20">
          </div>
        </section>

        <button id="downloadBtn" class="primary-btn" disabled>
          Exporter le fichier
        </button>
      </aside>

      <!-- Zone de Prévisualisation -->
      <section class="preview-section">
        <div class="preview-header">
          <span>Aperçu en direct</span>
          <span id="statusBadge" class="badge">Aucun fichier</span>
        </div>
        <div class="canvas-wrapper">
          <canvas id="previewCanvas"></canvas>
          <div id="placeholderText" class="placeholder-text">
            Importez une photo ou une vidéo pour commencer
          </div>
        </div>
        <div id="progressContainer" class="progress-container hidden">
          <div class="progress-bar" id="progressBar"></div>
          <span id="progressText">Rendu de la vidéo en cours...</span>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
